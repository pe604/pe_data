# Local development database (alternative to `npm run db:local` for machines with Docker).
# DATABASE_URL=postgresql://postgres:postgres@localhost:5433/pipeline
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pipeline
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
