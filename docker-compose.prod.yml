# Production: app + Postgres + a volume for uploaded files.
# Usage: docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
services:
  app:
    build: .
    restart: unless-stopped
    ports:
      # Localhost only: put an HTTPS reverse proxy (Caddy/nginx/IIS) in front; never expose 3000 directly.
      - "127.0.0.1:3000:3000"
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pipeline}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pipeline}
      STORAGE_DRIVER: local
      STORAGE_DIR: /data/files
    volumes:
      - files:/data/files
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pipeline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-pipeline}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 20

volumes:
  pgdata:
  files:
