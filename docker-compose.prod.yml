# Production: the app only. Database = your Postgres server (DB_* in .env.production); files = the S3 bucket.
# Usage: docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
services:
  app:
    build: .
    restart: unless-stopped
    ports:
      # Localhost only: put an HTTPS reverse proxy (Caddy/nginx/IIS) in front; never expose 3000 directly.
      - "127.0.0.1:3000:3000"
    env_file: .env.production
